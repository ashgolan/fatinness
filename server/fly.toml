app = "fateness-server"   # غيّره لاحقًا حسب اسم تطبيقك

kill_signal = "SIGINT"
kill_timeout = 5

[env]
  PORT = "4000"

[build]
  dockerfile = "Dockerfile"

[[services]]
  internal_port = 4000
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    interval = "10s"
    timeout = "2s"
